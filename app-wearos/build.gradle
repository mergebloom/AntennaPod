plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ktlint)
}

def releaseSigningProperties = ["releaseStoreFile", "releaseStorePassword", "releaseKeyAlias", "releaseKeyPassword"]
def configuredReleaseSigningProperties = releaseSigningProperties.findAll { project.hasProperty(it) }
if (!configuredReleaseSigningProperties.isEmpty() && configuredReleaseSigningProperties.size() != releaseSigningProperties.size()) {
    throw new GradleException("Release signing requires all of: ${releaseSigningProperties.join(', ')}")
}
def hasReleaseSigning = configuredReleaseSigningProperties.size() == releaseSigningProperties.size()
apply from: "../common.gradle"
apply from: "../playFlavor.gradle"

android {
    namespace "de.danoeh.antennapod.wearos"
    enableKotlin true

    defaultConfig {
        applicationId "ca.mkna.crunchcast"
        minSdk 25
        targetSdk 36
        versionCode 1000095
        versionName "1.0.0"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            releaseConfig {
                enableV1Signing true
                enableV2Signing true
                storeFile file(project.property("releaseStoreFile"))
                storePassword project.property("releaseStorePassword")
                keyAlias project.property("releaseKeyAlias")
                keyPassword project.property("releaseKeyPassword")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.releaseConfig
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard.cfg"
        }
    }

    buildFeatures {
        compose true
    }

    lint {
        disable "UnusedResources"
    }
}

afterEvaluate {
    tasks.named('lint').configure {
        dependsOn ktlintCheck
    }
}

gradle.taskGraph.whenReady { graph ->
    def releasePackagingRequested = graph.allTasks.any {
        it.project == project && it.name.toLowerCase().matches(".*(assemble|bundle|package).*release.*")
    }
    if (releasePackagingRequested && !hasReleaseSigning) {
        throw new GradleException("Release signing properties are required: ${releaseSigningProperties.join(', ')}")
    }
}

dependencies {
    implementation project(":model")
    implementation project(":ui:common")
    implementation project(":ui:notifications")
    implementation project(":net:sync:wear-interface")

    // NOTE: DO NOT INCLUDE a dependency on androidx.compose.material:material, the watch version is a replacement
    implementation libs.androidx.wear
    implementation libs.google.play.services.wearable
    implementation libs.androidx.wear.compose.foundation
    implementation libs.androidx.wear.compose.material3
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.runtime
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.core.ktx
    implementation libs.kotlinx.coroutines.play.services
    implementation libs.androidx.activity.compose
    implementation libs.androidx.appcompat

    testImplementation libs.junit
}
